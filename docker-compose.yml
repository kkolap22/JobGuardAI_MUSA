services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: jobguard-backend:latest
    container_name: jobguard-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - mongo
    restart: unless-stopped

  scanner:
    build:
      context: ./backend
      dockerfile: Dockerfile.scanner
    image: jobguard-scanner:latest
    profiles:
      - build

  mongo:
    image: mongo:7.0
    container_name: jobguard-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data: